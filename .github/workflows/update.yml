# Scheduled data update: NY Open Data winning numbers -> data/<game>/{draws,missing}.csv
#
# Timing (see docs/DECISIONS.md D-007, D-012, D-018):
#   Primary run 06:17 America/New_York (soft staleness WARN); retry 10:17 (hard FAIL).
#   timezone key is supported (Fact: docs.github.com workflow-syntax on.schedule).
# Keep-alive: WARN + step summary only; no bot commit (R2-02 / D-018). Quote D-013.
name: update

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/New_York"
    - cron: "17 10 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      force_now:
        description: "RFC3339 override for staleness (empty = real now). Use a future instant to prove the stale gate goes red."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Rust toolchain (1.99.1)
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Run diagnostics env (C-01 / D-028; R4-02/R4-03 Option A)
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Run created_at / run_started_at from the Actions API (UTC).
          created_at=""
          run_started_at=""
          if run_json=$(gh api "repos/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}" 2>/dev/null); then
            created_at=$(printf '%s' "$run_json" | jq -r '.created_at // empty')
            run_started_at=$(printf '%s' "$run_json" | jq -r '.run_started_at // empty')
          else
            echo "::warning::Could not fetch run timestamps via gh api; using runner clock for run_started_at"
            run_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          if [ -z "$run_started_at" ]; then
            run_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          fi
          # schedule_slot: cron string for scheduled runs; "manual" for workflow_dispatch.
          if [ -n "${SCHEDULE_CRON}" ]; then
            schedule_slot="${SCHEDULE_CRON}"
          else
            schedule_slot="manual"
          fi
          echo "LOTTOTOOL_RUN_STARTED_AT=${run_started_at}" >> "$GITHUB_ENV"
          echo "LOTTOTOOL_SCHEDULE_SLOT=${schedule_slot}" >> "$GITHUB_ENV"

          {
            echo "## Update run diagnostics (C-01 / R4-03 Option A)"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| github.event.schedule | \`${SCHEDULE_CRON:-}\` |"
            echo "| schedule_slot | \`${schedule_slot}\` |"
            echo "| run created_at (UTC) | \`${created_at}\` |"
            echo "| run run_started_at (UTC) | \`${run_started_at}\` |"
            echo
            echo "PB/MM ny_rows_updated_at freshness lines come from lottotool --json after each update (R4-03 Option A; no shell views fetch)."
            echo "ingest_log.csv rows are appended only when a new draw lands (same commit as draws)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Powerball
        id: pb
        run: |
          set -euo pipefail
          ./target/release/lottotool --json update powerball | tee /tmp/pb.json
          echo "added=$(jq -r '.added' /tmp/pb.json)" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq -r '.changed' /tmp/pb.json)" >> "$GITHUB_OUTPUT"
          raw=$(jq -r '.ny_rows_updated_at // empty' /tmp/pb.json)
          if [[ "$raw" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            ny="$raw"
          else
            if [ -n "$raw" ]; then
              echo "::warning::PB ny_rows_updated_at from tool failed strict YYYY-MM-DDTHH:MM:SSZ check; summary will show empty (D-028)"
            else
              echo "::warning::PB ny_rows_updated_at empty from tool (views unavailable); summary will show empty (D-028)"
            fi
            ny=""
          fi
          {
            echo "| PB ny_rows_updated_at (tool) | \`${ny}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Mega Millions
        id: mm
        run: |
          set -euo pipefail
          ./target/release/lottotool --json update megamillions | tee /tmp/mm.json
          echo "added=$(jq -r '.added' /tmp/mm.json)" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq -r '.changed' /tmp/mm.json)" >> "$GITHUB_OUTPUT"
          raw=$(jq -r '.ny_rows_updated_at // empty' /tmp/mm.json)
          if [[ "$raw" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            ny="$raw"
          else
            if [ -n "$raw" ]; then
              echo "::warning::MM ny_rows_updated_at from tool failed strict YYYY-MM-DDTHH:MM:SSZ check; summary will show empty (D-028)"
            else
              echo "::warning::MM ny_rows_updated_at empty from tool (views unavailable); summary will show empty (D-028)"
            fi
            ny=""
          fi
          {
            echo "| MM ny_rows_updated_at (tool) | \`${ny}\` |"
            echo
            echo "Freshness values above are the tool-observed Socrata views upper bound (same source as ingest_log when a row is appended)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn and upload CHANGES when historical rows changed (R2-08)
        if: steps.pb.outputs.changed != '0' || steps.mm.outputs.changed != '0'
        env:
          PB_CHANGED: ${{ steps.pb.outputs.changed }}
          MM_CHANGED: ${{ steps.mm.outputs.changed }}
        run: |
          set -euo pipefail
          echo "::warning::Historical draw row(s) changed (pb changed=${PB_CHANGED}, mm changed=${MM_CHANGED}). See data/*/CHANGES.md."
          ls -la data/*/CHANGES.md || true

      - name: Upload CHANGES artifact (R2-08)
        if: steps.pb.outputs.changed != '0' || steps.mm.outputs.changed != '0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: data-changes
          path: data/*/CHANGES.md
          if-no-files-found: warn

      - name: Integrity gate (all checks except staleness)
        run: ./target/release/lottotool check --fail-on-error --no-stale

      - name: Commit data changes
        # Prefer continuing to the staleness gate over failing the job on a rare
        # concurrent-dispatch rebase conflict (meta.json timestamps).
        continue-on-error: true
        env:
          PB_ADDED: ${{ steps.pb.outputs.added }}
          PB_CHANGED: ${{ steps.pb.outputs.changed }}
          MM_ADDED: ${{ steps.mm.outputs.added }}
          MM_CHANGED: ${{ steps.mm.outputs.changed }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            pb_a=${PB_ADDED}; pb_c=${PB_CHANGED}
            mm_a=${MM_ADDED}; mm_c=${MM_CHANGED}
            msg="data: NY Open Data update $(date -u +%Y-%m-%dT%H:%MZ) (pb +${pb_a}/~${pb_c}, mm +${mm_a}/~${mm_c})"
            if [ "${pb_c}" != "0" ] || [ "${mm_c}" != "0" ]; then
              msg="${msg}; historical row changes listed in data/*/CHANGES.md (R-05)"
            fi
            git commit -m "$msg"
            if ! git pull --rebase origin main; then
              echo "::warning::rebase conflict while pushing data commit; aborting rebase so staleness gate still runs"
              git rebase --abort || true
              exit 1
            fi
            git push
          fi

      - name: Non-bot activity warning (no keep-alive commit; R2-02 / D-018)
        run: |
          set -euo pipefail
          now=$(date +%s)
          # Official quote (docs.github.com, Disabling and enabling a workflow):
          # "In a public repository, scheduled workflows are automatically disabled when
          #  no repository activity has occurred in 60 days."
          # Whether GITHUB_TOKEN / github-actions[bot] commits count as that activity is
          # NOT stated in the official docs (Inference from community keepalive tooling:
          # they do not). See D-013. Claude Phase 3 concern: a bot keep-alive commit does
          # not reliably reset the 60-day clock and can mask real inactivity.
          nonbot_line=$(git log --format='%ct %an <%ae>' | grep -vE '\[bot\]|github-actions|41898282\+github-actions' | head -1 || true)
          if [ -z "$nonbot_line" ]; then
            nonbot_age=9999
            echo "WARNING: no non-bot commits found in history"
          else
            nonbot_ts=${nonbot_line%% *}
            nonbot_age=$(( (now - nonbot_ts) / 86400 ))
            echo "Last non-bot commit: ${nonbot_line} (${nonbot_age} days ago)"
          fi
          {
            echo "## Non-bot activity"
            echo "days_since_nonbot=${nonbot_age}"
            echo
            echo "No keep-alive bot commit is made (R2-02). Owner calendar reminder: touch the repo before day 60 (see OI-09 / OI-18)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$nonbot_age" -ge 45 ]; then
            echo "::warning::Days since last non-bot commit: ${nonbot_age}. Official docs disable schedules after 60 days without repository activity; whether bot commits count is unverified (D-013). Owner touch / calendar reminder required — no bot keep-alive commit (R2-02)."
          fi

      - name: Full check incl. staleness (fails visibly if a due draw is absent)
        # R-01: shell: bash => bash -eo pipefail, so a FAIL from check is not hidden by tee.
        # Run even if the prior commit step hit a race (continue-on-error), so force_now
        # red/green proofs are not skipped.
        # R2-05: 06:17 schedule uses --stale-as-warn; 10:17 and dispatch FAIL on stale.
        if: success() || failure()
        shell: bash
        env:
          FORCE_NOW: ${{ inputs.force_now }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          args=(check --fail-on-error)
          if [ -n "${FORCE_NOW}" ]; then
            echo "Using --now ${FORCE_NOW} (workflow_dispatch force_now)"
            args+=(--now "${FORCE_NOW}")
          fi
          if [ "${SCHEDULE_CRON}" = "17 6 * * *" ]; then
            echo "06:17 ET schedule: staleness is WARN-only (R2-05)"
            args+=(--stale-as-warn)
          fi
          ./target/release/lottotool "${args[@]}" | tee check.txt
          ./target/release/lottotool --json "${args[@]}" > check.json || true

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: check-report
          path: |
            check.txt
            check.json
          if-no-files-found: ignore
