# Tag-triggered multi-OS release (R-14). Push a v* tag to build and publish.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: lottotool
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bin: lottotool.exe
          - os: macos-14
            target: aarch64-apple-darwin
            bin: lottotool
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust toolchain (1.99.1)
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          rustc --version
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="lottotool-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist/"$name"
          cp "target/release/${{ matrix.bin }}" README.md LICENSE eras.toml dist/"$name"/
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            (cd dist && tar -a -cf "${name}.zip" "$name")
            artifact="${name}.zip"
          else
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
            artifact="${name}.tar.gz"
          fi
          (cd dist && sha256sum "$artifact" > "${name}.sha256")
          ls -la dist/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true
      - name: Flatten and checksum index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec cp -t dist {} +
          cd dist
          cat *.sha256 | sort > SHA256SUMS
          cat SHA256SUMS
          ls -la
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/*.zip dist/SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "lottotool $GITHUB_REF_NAME" --generate-notes
