[[game.null_rule]]
field = "multiplier"
from = "2002-05-17"
to = "2011-01-17"
status = "NOT_APPLICABLE"
reason = "NY column description: 'Multiplier (started 1/18/2011)'"
source = "NY Open Data 5xaw-6ayf column metadata"

[[game.null_rule]]
field = "multiplier"
from = "2025-04-08"
to = "9999-12-31"
status = "MISSING"
reason = "Built-in multiplier era: NY dataset has no multiplier value since 2025-04-08"
source = "NY Open Data 5xaw-6ayf; megamillions.com 2025 matrix-change news"

[[game.null_rule]]
field = "double_play"
from = "2002-05-17"
to = "9999-12-31"
status = "NOT_APPLICABLE"
reason = "Mega Millions has no Double Play; dp_* columns are always empty for this game"
source = "schema convention (shared draws.csv schema)"
