# Scheduled data update: NY Open Data winning numbers -> data/<game>/{draws,missing}.csv
#
# Timing (see docs/DECISIONS.md D-007, D-012, D-018):
#   Primary run 06:17 America/New_York (soft staleness WARN); retry 10:17 (hard FAIL).
#   timezone key is supported (Fact: docs.github.com workflow-syntax on.schedule).
# Keep-alive: WARN + step summary only; no bot commit (R2-02 / D-018). Quote D-013.
name: update

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/New_York"
    - cron: "17 10 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      force_now:
        description: "RFC3339 override for staleness (empty = real now). Use a future instant to prove the stale gate goes red."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Rust toolchain (stable)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Update Powerball
        id: pb
        run: |
          set -euo pipefail
          ./target/release/lottotool --json update powerball | tee /tmp/pb.json
          echo "added=$(python3 -c 'import json;print(json.load(open("/tmp/pb.json"))["added"])')" >> "$GITHUB_OUTPUT"
          echo "changed=$(python3 -c 'import json;print(json.load(open("/tmp/pb.json"))["changed"])')" >> "$GITHUB_OUTPUT"

      - name: Update Mega Millions
        id: mm
        run: |
          set -euo pipefail
          ./target/release/lottotool --json update megamillions | tee /tmp/mm.json
          echo "added=$(python3 -c 'import json;print(json.load(open("/tmp/mm.json"))["added"])')" >> "$GITHUB_OUTPUT"
          echo "changed=$(python3 -c 'import json;print(json.load(open("/tmp/mm.json"))["changed"])')" >> "$GITHUB_OUTPUT"

      - name: Warn and upload CHANGES when historical rows changed (R2-08)
        if: steps.pb.outputs.changed != '0' || steps.mm.outputs.changed != '0'
        run: |
          set -euo pipefail
          echo "::warning::Historical draw row(s) changed (pb changed=${{ steps.pb.outputs.changed }}, mm changed=${{ steps.mm.outputs.changed }}). See data/*/CHANGES.md."
          ls -la data/*/CHANGES.md || true

      - name: Upload CHANGES artifact (R2-08)
        if: steps.pb.outputs.changed != '0' || steps.mm.outputs.changed != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-changes
          path: data/*/CHANGES.md
          if-no-files-found: warn

      - name: Integrity gate (all checks except staleness)
        run: ./target/release/lottotool check --fail-on-error --no-stale

      - name: Commit data changes
        # Prefer continuing to the staleness gate over failing the job on a rare
        # concurrent-dispatch rebase conflict (meta.json timestamps).
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            pb_a=${{ steps.pb.outputs.added }}; pb_c=${{ steps.pb.outputs.changed }}
            mm_a=${{ steps.mm.outputs.added }}; mm_c=${{ steps.mm.outputs.changed }}
            msg="data: NY Open Data update $(date -u +%Y-%m-%dT%H:%MZ) (pb +${pb_a}/~${pb_c}, mm +${mm_a}/~${mm_c})"
            if [ "${pb_c}" != "0" ] || [ "${mm_c}" != "0" ]; then
              msg="${msg}; historical row changes listed in data/*/CHANGES.md (R-05)"
            fi
            git commit -m "$msg"
            if ! git pull --rebase origin main; then
              echo "::warning::rebase conflict while pushing data commit; aborting rebase so staleness gate still runs"
              git rebase --abort || true
              exit 1
            fi
            git push
          fi

      - name: Non-bot activity warning (no keep-alive commit; R2-02 / D-018)
        run: |
          set -euo pipefail
          now=$(date +%s)
          # Official quote (docs.github.com, Disabling and enabling a workflow):
          # "In a public repository, scheduled workflows are automatically disabled when
          #  no repository activity has occurred in 60 days."
          # Whether GITHUB_TOKEN / github-actions[bot] commits count as that activity is
          # NOT stated in the official docs (Inference from community keepalive tooling:
          # they do not). See D-013. Claude Phase 3 concern: a bot keep-alive commit does
          # not reliably reset the 60-day clock and can mask real inactivity.
          nonbot_line=$(git log --format='%ct %an <%ae>' | grep -vE '\[bot\]|github-actions|41898282\+github-actions' | head -1 || true)
          if [ -z "$nonbot_line" ]; then
            nonbot_age=9999
            echo "WARNING: no non-bot commits found in history"
          else
            nonbot_ts=${nonbot_line%% *}
            nonbot_age=$(( (now - nonbot_ts) / 86400 ))
            echo "Last non-bot commit: ${nonbot_line} (${nonbot_age} days ago)"
          fi
          {
            echo "## Non-bot activity"
            echo "days_since_nonbot=${nonbot_age}"
            echo
            echo "No keep-alive bot commit is made (R2-02). Owner calendar reminder: touch the repo before day 60 (see OI-09 / OI-18)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$nonbot_age" -ge 45 ]; then
            echo "::warning::Days since last non-bot commit: ${nonbot_age}. Official docs disable schedules after 60 days without repository activity; whether bot commits count is unverified (D-013). Owner touch / calendar reminder required — no bot keep-alive commit (R2-02)."
          fi

      - name: Full check incl. staleness (fails visibly if a due draw is absent)
        # R-01: shell: bash => bash -eo pipefail, so a FAIL from check is not hidden by tee.
        # Run even if the prior commit step hit a race (continue-on-error), so force_now
        # red/green proofs are not skipped.
        # R2-05: 06:17 schedule uses --stale-as-warn; 10:17 and dispatch FAIL on stale.
        if: success() || failure()
        shell: bash
        env:
          FORCE_NOW: ${{ inputs.force_now }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          args=(check --fail-on-error)
          if [ -n "${FORCE_NOW}" ]; then
            echo "Using --now ${FORCE_NOW} (workflow_dispatch force_now)"
            args+=(--now "${FORCE_NOW}")
          fi
          if [ "${SCHEDULE_CRON}" = "17 6 * * *" ]; then
            echo "06:17 ET schedule: staleness is WARN-only (R2-05)"
            args+=(--stale-as-warn)
          fi
          ./target/release/lottotool "${args[@]}" | tee check.txt
          ./target/release/lottotool --json "${args[@]}" > check.json || true

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-report
          path: |
            check.txt
            check.json
          if-no-files-found: ignore
