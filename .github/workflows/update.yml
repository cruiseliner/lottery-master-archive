# Scheduled data update: NY Open Data winning numbers -> data/<game>/{draws,missing}.csv
#
# Timing (see docs/DECISIONS.md D-007):
#   Powerball draws Mon/Wed/Sat ~22:59 ET, Mega Millions Tue/Fri ~23:00 ET.
#   NY Open Data rows were observed to appear ~03:30-03:40 ET the next morning.
#   We run once a day at 06:17 America/New_York (after every draw night; off-minute to
#   avoid top-of-hour scheduler congestion). On non-draw mornings the run is a no-op.
# Staleness: a draw is "due" 30h after 00:00 ET on the draw date (eras.toml
#   stale_grace_hours), i.e. 06:00 ET the next morning, so a missing row turns this
#   workflow red (visible failure) instead of silently passing.
# Keep-alive: GitHub disables schedules in public repos after 60 days without repository
#   activity; if the last commit is older than 45 days we commit docs/.keepalive.
name: update

on:
  schedule:
    - cron: "17 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Update Powerball
        run: ./target/release/lottotool update powerball

      - name: Update Mega Millions
        run: ./target/release/lottotool update megamillions

      - name: Integrity gate (all checks except staleness)
        run: ./target/release/lottotool check --fail-on-error --no-stale

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: NY Open Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Keep-alive (avoid 60-day schedule disable)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Last commit age: ${age_days} days"
          if [ "$age_days" -ge 45 ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > docs/.keepalive
            git add docs/.keepalive
            git commit -m "chore: keep-alive (last commit ${age_days} days ago)"
            git push
          fi

      - name: Full check incl. staleness (fails visibly if a due draw is absent)
        run: |
          ./target/release/lottotool check --fail-on-error | tee check.txt
          ./target/release/lottotool --json check > check.json || true

      - name: Upload check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: |
            check.txt
            check.json
          if-no-files-found: ignore
