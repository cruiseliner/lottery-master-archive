name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (stable + clippy + rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Committed data passes integrity checks
        run: cargo run --release --locked -- check --fail-on-error --no-stale

      - name: Refuse tracked cache/, ledger/, tickets*.csv, or non-header payouts CSVs (R3-06 / R6-04)
        run: |
          set -euo pipefail
          tracked=$(git ls-files cache || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked files under cache/ (must stay gitignored):"
            echo "$tracked"
            exit 1
          fi
          # R6-04 / D-030: private picks — nested ledger/ dirs and tickets*.csv
          tracked_ledger=$(git ls-files | grep -Ei '(^|/)ledger(/|$)' || true)
          if [ -n "$tracked_ledger" ]; then
            echo "::error::Tracked path under ledger/ (private picks; must stay gitignored):"
            echo "$tracked_ledger"
            exit 1
          fi
          tracked_tickets=$(git ls-files | grep -Ei '(^|/)tickets[^/]*\.csv$' || true)
          if [ -n "$tracked_tickets" ]; then
            echo "::error::Tracked tickets*.csv (private picks; must stay gitignored):"
            echo "$tracked_tickets"
            exit 1
          fi
          bad=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 1 ]; then
              echo "::error::$f has $lines lines (header-only payouts*.csv allowed in-repo; row data belongs in cache/)"
              bad=1
            fi
          done < <(git ls-files '*payouts*.csv' || true)
          if [ "$bad" -ne 0 ]; then exit 1; fi
          echo "OK: no tracked cache/; no tracked ledger/; no tracked tickets*.csv; payouts CSVs are header-only or absent"
